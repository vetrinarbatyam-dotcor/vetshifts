<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>VetShifts — בדיקת המנוע</title>
<style>
  :root{--ink:#1E2A2C;--bg:#F6F7F4;--card:#fff;--rule:#D5DCD9;--teal:#0F6E63;
        --ok:#1E7B45;--okbg:#DDF2E4;--bad:#A63434;--badbg:#F8DCDC;--muted:#5F6E6C}
  *{box-sizing:border-box}
  body{margin:0;padding:1.5rem;background:var(--bg);color:var(--ink);
       font:15px/1.5 Heebo,"Segoe UI",system-ui,sans-serif}
  main{max-width:760px;margin:0 auto}
  h1{font-size:1.3rem;margin:0 0 .2rem}
  .sum{font-variant-numeric:tabular-nums;font-weight:700;padding:.5rem .8rem;border-radius:6px;
       display:inline-block;margin:.6rem 0 1rem}
  .sum.ok{background:var(--okbg);color:var(--ok)} .sum.bad{background:var(--badbg);color:var(--bad)}
  ul{list-style:none;margin:0;padding:0}
  li{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:.45rem .7rem;margin-bottom:.3rem}
  li.f{border-color:var(--bad)}
  .m{color:var(--muted);font-size:.85rem;padding-inline-start:1.6rem}
  .tag{font-weight:700;margin-inline-end:.5rem}
  .tag.p{color:var(--ok)} .tag.f{color:var(--bad)}
  p.note{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>VetShifts — בדיקת מנוע השיבוץ</h1>
  <p class="note">נטען ישירות מהקבצים. אפשר גם <code>node test.js</code>.</p>
  <div id="sum" class="sum">מריץ…</div>
  <ul id="list"></ul>
</main>
<script src="solver.js"></script>
<script src="test.js"></script>
<script>
(function(){
  var a = globalThis.VetShiftsTests, list = document.getElementById('list'), sum = document.getElementById('sum');
  a.results.forEach(function(r){
    var li = document.createElement('li');
    if(!r.ok) li.className = 'f';
    var tag = document.createElement('span');
    tag.className = 'tag ' + (r.ok ? 'p' : 'f');
    tag.textContent = r.ok ? '✓' : '✗';
    li.append(tag, document.createTextNode(r.name));
    if(!r.ok){ var d = document.createElement('div'); d.className='m'; d.textContent = r.err; li.append(d); }
    list.append(li);
  });
  var pass = a.passed === a.total;
  sum.className = 'sum ' + (pass ? 'ok' : 'bad');
  sum.textContent = (pass ? 'הכל עבר — ' : 'יש כשלים — ') + a.passed + '/' + a.total;
  document.title = (pass ? '✓ ' : '✗ ') + a.passed + '/' + a.total + ' — VetShifts';
})();
</script>
</body>
</html>
